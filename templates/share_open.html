<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>رابط مشترك</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f0f0f; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #fff; margin: 0; }
  .card { background: linear-gradient(160deg, #1e1e1e, #141414); border: 1px solid #ff6b35; border-radius: 24px; padding: 36px 28px; text-align: center; max-width: 420px; width: 90%; }
  .msg { font-size: 16px; line-height: 1.8; color: #ffb74d; }
  a { color: #4fc3f7; }
</style>
</head>
<body>
<div class="card">
  <h2>🔗 رابط مشترك</h2>
  <div class="msg" id="msg">{% if message %}{{ message }}{% else %}⏳ جاري فتح الرابط...{% endif %}</div>
  <div style="margin-top:18px;font-size:13px;"><a href="/">الصفحة الرئيسية</a></div>
</div>
{% if not message %}
<script>
(async () => {
  const msg = document.getElementById('msg');
  const token = location.hash.slice(1);
  // drop the token from the address bar / history right away
  history.replaceState(null, '', location.pathname);
  if (!token) { msg.textContent = 'الرابط ده مش صحيح أو ناقص. انسخه كامل وجرب تاني.'; return; }
  try {
    const r = await fetch('/api/links/open', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                body: JSON.stringify({ token }) });
    const j = await r.json();
    if (j.ok) { location.replace(j.redirect); return; }
    msg.textContent = j.message || 'الرابط مش شغال.';
  } catch (e) { msg.textContent = 'حصل خطأ في الاتصال. جرب تاني.'; }
})();
</script>
{% endif %}
</body>
</html>
