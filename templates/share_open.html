<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#062016">
<link rel="stylesheet" href="{{ url_for('static', filename='plasma.css') }}">
<meta name="referrer" content="no-referrer">
<title>رابط مشترك</title>
<style>.msg { font-size: 16px; line-height: 1.8; color: var(--warn); }</style>
</head>
<body>
{% include "_scene.html" %}
<div class="card">
  <div class="brand"><i></i> Easy Calls</div>
  <h1>🔗 رابط <b>مشترك</b></h1>
  <div class="msg" id="msg">{% if message %}{{ message }}{% else %}⏳ جاري فتح الرابط...{% endif %}</div>
  <div style="margin-top:18px;font-size:13px;"><a href="/">الصفحة الرئيسية</a></div>
</div>
{% if not message %}
<script>
(async () => {
  const msg = document.getElementById('msg');
  const token = location.hash.slice(1);
  // drop the token from the address bar / history right away
  history.replaceState(null, '', location.pathname);
  if (!token) { msg.textContent = 'الرابط ده مش صحيح أو ناقص. انسخه كامل وجرب تاني.'; return; }
  try {
    const r = await fetch('/api/links/open', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                body: JSON.stringify({ token }) });
    const j = await r.json();
    if (j.ok) { location.replace(j.redirect); return; }
    msg.textContent = j.message || 'الرابط مش شغال.';
  } catch (e) { msg.textContent = 'حصل خطأ في الاتصال. جرب تاني.'; }
})();
</script>
{% endif %}
</body>
</html>
