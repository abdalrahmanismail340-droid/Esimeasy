<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f0f0f; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #fff; }
  .card { background: linear-gradient(160deg, #1e1e1e, #141414); border: 1px solid #ff6b35; border-radius: 24px; padding: 48px 40px; text-align: center; max-width: 380px; width: 90%; box-shadow: 0 0 40px rgba(255,107,53,0.15); }
  .logo { font-size: 60px; margin-bottom: 16px; filter: drop-shadow(0 4px 12px rgba(255,107,53,0.4)); }
  h1 { font-size: 24px; margin-bottom: 8px; color: #ff6b35; }
  p { color: #bbb; font-size: 14px; margin-bottom: 28px; }
  .gbtn { display: inline-flex; align-items: center; gap: 12px; background: #ff6b35; color: #fff; border: none; border-radius: 12px; padding: 14px 32px; font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; transition: transform .15s, box-shadow .15s; }
  .gbtn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,107,53,0.4); }
  .gbtn svg { width: 20px; height: 20px; background: #fff; border-radius: 50%; padding: 2px; }
  .note { margin-top: 24px; font-size: 12px; color: #666; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">📞</div>
    <h1>Welcome</h1>
    <p>Sign in with Google to continue</p>
    <a class="gbtn" href="/login">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Sign in with Google
    </a>
    <div class="note">We only use your basic info (name and email)</div>
  </div>
</body>
</html>
