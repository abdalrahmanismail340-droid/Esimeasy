<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#062016">
<link rel="stylesheet" href="{{ url_for('static', filename='plasma.css') }}">
<title>تسجيل الدخول</title>
<style>
  .gbtn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
  .gbtn svg { width: 22px; height: 22px; background: #fff; border-radius: 50%; padding: 3px; }
</style>

<body>
{% include "_scene.html" %}
  <div class="card">
    <div class="brand"><i></i> Easy Calls</div>
    <h1>مكالمات دولية<br><b>من المتصفح</b></h1>
    <p class="sub">سجّل دخول بحساب جوجل وكلّم أي رقم من رصيد Easy Coins</p>
    <div class="pcard-wrap"><div class="pcard">
      <div class="logo"></div>
      <div class="label">EASY COINS</div>
      <div class="amount">•••• <small>C</small></div>
      <div class="hint">بيتخصم من الكوينز بس</div>
      <div class="chip-row">WebRTC • SIP</div>
    </div></div>
    <a class="btn primary gbtn" href="/login">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      الدخول بجوجل
    </a>
    <div class="muted">بنستخدم بياناتك الأساسية بس (الاسم والإيميل)</div>
  </div>
<script src="{{ url_for('static', filename='plasma.js') }}"></script>
