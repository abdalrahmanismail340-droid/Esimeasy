<div class="share-box" style="margin:14px 0;padding:14px;border:1px solid #4fc3f755;border-radius:14px;text-align:right;font-size:14px;color:#ccc;">
  <div style="font-weight:700;color:#4fc3f7;margin-bottom:6px;">🔗 رابط للدايلر من غير تسجيل دخول</div>
  <div style="font-size:12px;color:#888;margin-bottom:8px;">أي حد معاه الرابط يقدر يتصل من كوينزك (C) لحد ما الرابط يخلص أو تلغيه. ابعته لحد تثق فيه بس.</div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
    <select id="shareHours" style="padding:6px;border-radius:8px;background:#222;color:#fff;border:1px solid #444;">
      {% for h, name in expiry_choices.items() %}<option value="{{ h }}"{% if h == default_hours %} selected{% endif %}>{{ name }}</option>{% endfor %}
    </select>
    <input id="shareLabel" maxlength="40" placeholder="اسم للرابط (اختياري)" style="flex:1;min-width:110px;padding:6px;border-radius:8px;background:#222;color:#fff;border:1px solid #444;">
    <button type="button" id="shareGen" style="padding:6px 12px;border-radius:8px;border:none;background:#0288d1;color:#fff;cursor:pointer;">إنشاء رابط</button>
  </div>
  <div id="shareOut" style="display:none;margin-top:8px;">
    <input id="shareUrl" readonly style="width:100%;direction:ltr;padding:6px;border-radius:8px;background:#111;color:#81c784;border:1px solid #333;font-size:12px;">
    <button type="button" id="shareCopy" style="margin-top:4px;padding:4px 10px;border-radius:8px;border:1px solid #81c78455;background:none;color:#81c784;cursor:pointer;">نسخ</button>
    <span style="font-size:11px;color:#888;">الرابط بيظهر مرة واحدة بس — انسخه دلوقتي.</span>
  </div>
  <div id="shareMsg" style="font-size:12px;color:#ffb74d;margin-top:6px;"></div>
  <div style="margin-top:10px;font-weight:700;font-size:13px;">الروابط الشغالة</div>
  <div id="shareList" style="font-size:12px;color:#aaa;">...</div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const fmt = t => new Date(t * 1000).toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' });
  async function load() {
    try {
      const r = await fetch('/api/links'); const j = await r.json();
      const list = $('shareList'); list.textContent = '';
      if (!j.links || !j.links.length) { list.textContent = 'مفيش روابط شغالة.'; return; }
      for (const l of j.links) {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #2a2a2a;gap:6px;';
        const txt = document.createElement('span');
        txt.textContent = `${l.label || 'رابط ' + l.id} — لحد ${fmt(l.expires_at)}` + (l.last_used_at ? ` • آخر استخدام ${fmt(l.last_used_at)}` : ' • لسه متستخدمش');
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = 'إلغاء';
        b.style.cssText = 'padding:2px 8px;border-radius:6px;border:1px solid #ff6b6b55;background:none;color:#ff6b6b;cursor:pointer;';
        b.onclick = async () => {
          if (!confirm('تلغي الرابط ده؟ اللي معاه مش هيقدر يتصل تاني.')) return;
          await fetch(`/api/links/${l.id}/revoke`, { method: 'POST' }); load();
        };
        row.append(txt, b); list.append(row);
      }
    } catch (e) { $('shareList').textContent = 'تعذر تحميل الروابط.'; }
  }
  $('shareGen').onclick = async () => {
    $('shareMsg').textContent = ''; $('shareGen').disabled = true;
    try {
      const r = await fetch('/api/links', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ hours: +$('shareHours').value, label: $('shareLabel').value }) });
      const j = await r.json();
      if (!r.ok) { $('shareMsg').textContent = j.error || 'فشل إنشاء الرابط'; }
      else { $('shareUrl').value = j.url; $('shareOut').style.display = ''; $('shareLabel').value = ''; load(); }
    } catch (e) { $('shareMsg').textContent = 'خطأ: ' + e; }
    $('shareGen').disabled = false;
  };
  $('shareCopy').onclick = () => {
    $('shareUrl').select();
    if (navigator.clipboard) navigator.clipboard.writeText($('shareUrl').value);
    $('shareCopy').textContent = 'اتنسخ ✅';
  };
  load();
})();
</script>
